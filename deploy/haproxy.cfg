# Example HAProxy config for Lb01
# Copy the "frontend"/"backend" blocks below into /etc/haproxy/haproxy.cfg
# on the load balancer, then: sudo systemctl restart haproxy
#
# Replace <WEB01_IP> and <WEB02_IP> with the actual private IPs of your two web servers.

global
    daemon
    maxconn 256

defaults
    mode    http
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend drnath_frontend
    bind *:80
    default_backend drnath_backend

backend drnath_backend
    balance roundrobin
    option httpchk GET /api/health
    server web01 <WEB01_IP>:3000 check
    server web02 <WEB02_IP>:3000 check
